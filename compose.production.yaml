name: peppilot-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      EMAIL_FROM: "${EMAIL_FROM:?EMAIL_FROM must be set}"
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST must be set to smtp.resend.com}"
      SMTP_PORT: "${SMTP_PORT:?SMTP_PORT must be set to 465}"
      SMTP_SECURE: "${SMTP_SECURE:?SMTP_SECURE must be set to true}"
      SMTP_USER: "${SMTP_USER:?SMTP_USER must be set to resend}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD must be set to the Resend API key}"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      NODE_ENV: production
    depends_on:
      database:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["npm", "run", "db:seed"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - peppilot_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  peppilot_production_postgres_data:
